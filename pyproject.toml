[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "nezha-stand"
version = "0.1.0"
description = "Standalone Isaac Gym training project for Nezha standing"
requires-python = ">=3.8,<3.9"
dependencies = [
    "matplotlib>=3.3,<3.8",
    # Isaac Gym Preview 4 imports the removed np.float alias.
    "numpy==1.23.5",
    "PyYAML>=5.4,<7",
    "scipy>=1.6,<1.11",
    # TensorBoard 2.14 dropped Python 3.8 support.
    "tensorboard>=2.8,<2.14",
]

[project.optional-dependencies]
# 3.2.0 provides Linux CPython 3.8 wheels and is compatible with the Isaac Gym
# Python environment used by this repository.
mujoco = ["mujoco==3.2.0"]

[tool.setuptools.packages.find]
include = ["nezha_stand*", "legged_gym*", "rsl_rl*", "deploy*"]
